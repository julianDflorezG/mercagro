<h2>Mi Perfil</h2>

<article class="card p-3" aria-labelledby="perfil-nombre">
  <p><strong>Nombre:</strong> <span id="perfil-nombre"></span></p>
  <p><strong>Email:</strong> <span id="perfil-email"></span></p>
  <p><strong>Rol:</strong> <span id="perfil-rol"></span></p>

  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil">Editar</button>
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarPerfil">Eliminar cuenta</button>
  </div>
</article>

<!-- Modal Editar Perfil -->
<div class="modal fade" id="modalEditarPerfil" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalEditarPerfilLabel">
  <div class="modal-dialog">
    <form id="form-editar-perfil" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarPerfilLabel">Editar Perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="edit-nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="edit-nombre" required />
        </div>
        <div class="mb-3">
          <label for="edit-password" class="form-label">Nueva contraseña (opcional)</label>
          <input type="password" class="form-control" id="edit-password" />
        </div>
        <div id="perfil-error" class="text-danger d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Confirmar Eliminación -->
<div class="modal fade" id="modalEliminarPerfil" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalEliminarPerfilLabel">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="modalEliminarPerfilLabel">Confirmar eliminación</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        ¿Estás seguro de que deseas eliminar tu cuenta? Esta acción no se puede deshacer.
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmar-eliminar-perfil" aria-label="Eliminar cuenta de usuario">Sí, eliminar</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>
