<h2>Productos del mercado</h2>

<!-- Botón Crear -->
<div class="mb-3 text-end">
  <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCrearProducto">
    + Crear Producto
  </button>
</div>

<!-- Tabla de productos -->
<div class="table-responsive">
  <table class="table table-bordered table-hover" id="tabla-productos">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio Ref.</th>
        <th>Unidad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- JS insertará filas aquí -->
    </tbody>
  </table>
</div>

<!-- Error de carga -->
<div id="productos-error" class="alert alert-danger d-none mt-3" role="alert"></div>

<!-- Modal Crear Producto -->
<div class="modal fade" id="modalCrearProducto" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalCrearProductoLabel">
  <div class="modal-dialog">
    <form id="form-crear-producto" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearProductoLabel">Crear Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="producto-nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="producto-nombre" required />
        </div>
        <div class="mb-3">
          <label for="producto-precio-referencia" class="form-label">Precio de Referencia</label>
          <input type="number" class="form-control" id="producto-precio-referencia" required />
        </div>
        <div class="mb-3">
          <label for="producto-unidad" class="form-label">Unidad de Medida</label>
          <input type="text" class="form-control" id="producto-unidad" required />
        </div>
        <div id="crear-producto-error" class="alert alert-danger d-none mt-2" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success" aria-label="Guardar producto">Guardar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </form>
  </div>
</div>
