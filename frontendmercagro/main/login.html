<div class="d-flex align-items-center justify-content-center vh-100 w-100">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">

    <h1 class="text-center mb-4" id="titulo-login">Mercagro</h1>

    <form id="login-form" aria-labelledby="titulo-login">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" name="email" aria-required="true" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" aria-required="true" required>
      </div>
      <div id="login-error" class="text-danger mb-3 d-none" role="alert"></div>        
      <button type="submit" class="btn btn-primary w-100" aria-label="Iniciar sesión">Iniciar sesión</button>
    </form>

    <div class="text-center mt-3">
      <a href="#registro" id="ir-a-registro" aria-label="Ir al formulario de registro">¿No tienes cuenta? Regístrate</a>
    </div>

  </div>
</div>
