<h2 id="titulo-solicitudes-comprador">Solicitudes Enviadas</h2>

<div id="solicitudes-error" class="alert alert-danger d-none" role="alert"></div>

<div class="table-responsive">
  <table class="table table-bordered table-hover" id="tabla-solicitudes-comprador" role="table" aria-labelledby="titulo-solicitudes-comprador">
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Producto</th>
        <th scope="col">Mensaje</th>
        <th scope="col">Estado</th>
        <th scope="col">Fecha</th>
        <th scope="col">Acción</th>
      </tr>
    </thead>
    <tbody>
      <!-- JS insertará aquí -->
    </tbody>
  </table>
</div>

<!-- Modal Cambiar Estado -->
<div class="modal fade" id="modalCambiarEstadoComprador" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalCambiarEstadoCompradorLabel">
  <div class="modal-dialog">
    <form id="form-cambiar-estado-comprador" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCambiarEstadoCompradorLabel">Cambiar Estado de la Solicitud</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="comprador-estado-id" />
        <label for="comprador-estado-nuevo" class="form-label">Nuevo Estado</label>
        <select class="form-select" id="comprador-estado-nuevo" required></select>
        <div id="comprador-estado-error" class="alert alert-danger d-none mt-2" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Guardar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </form>
  </div>
</div>
